<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Marcador provisional de fondo del taller">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e16"/>
      <stop offset="0.5" stop-color="#14532d"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#fondo)"/>

  <!-- Ruedas de moto (sugerencia de taller mecánico) -->
  <circle cx="280" cy="660" r="190" fill="none" stroke="#22c55e" stroke-opacity="0.30" stroke-width="30"/>
  <circle cx="280" cy="660" r="130" fill="none" stroke="#4ade80" stroke-opacity="0.45" stroke-width="12"/>
  <g stroke="#bbf7d0" stroke-opacity="0.4" stroke-width="10">
    <line x1="280" y1="470" x2="280" y2="850"/>
    <line x1="90" y1="660" x2="470" y2="660"/>
  </g>

  <circle cx="1280" cy="600" r="150" fill="none" stroke="#22c55e" stroke-opacity="0.22" stroke-width="26"/>
  <circle cx="1280" cy="600" r="100" fill="none" stroke="#4ade80" stroke-opacity="0.35" stroke-width="10"/>

  <!-- Estanterías / herramientas del taller -->
  <g fill="#22c55e" fill-opacity="0.15">
    <rect x="120" y="130" width="240" height="42" rx="8"/>
    <rect x="160" y="200" width="160" height="42" rx="8"/>
    <rect x="1250" y="120" width="230" height="42" rx="8"/>
    <rect x="1280" y="190" width="170" height="42" rx="8"/>
  </g>

  <!-- Línea de suelo del taller -->
  <rect y="820" width="1600" height="80" fill="#052e16" fill-opacity="0.5"/>
</svg>
